name: Get jac kit
description: >
  Download the kit artifact into the checkout (binary, typeshed stubs, vendored
  musl/wasm runtimes land at their in-tree paths), put jac on PATH, and, on a
  reroute lane, seed the checkout with the shared JIR precompile bundle. The
  kit is the binary built from this checkout (build-kit); the job's
  JAC_NO_DEV_SOURCE decides whether it runs sealed ("1") or through the [dev]
  reroute (""). upload-artifact strips the executable bit; restore it.
inputs:
  name:
    description: Kit artifact name
    required: false
    default: jac-kit
  precompiled-name:
    description: >
      Precompile bundle artifact name. Reroute lanes only; a sealed lane never
      downloads it (it boots from the payload's own sealed image instead).
    required: false
    default: jac-precompiled
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: jac

    - shell: bash
      run: |
        chmod +x "$GITHUB_WORKSPACE/jac/zig-out/bin/jac"
        echo "$GITHUB_WORKSPACE/jac/zig-out/bin" >> "$GITHUB_PATH"

    # A composite step's `if:` cannot read the caller's job-level env through
    # the `env` context, so branch on a step output instead.
    - name: Resolve lane mode
      id: mode
      shell: bash
      run: |
        if [ "${JAC_NO_DEV_SOURCE:-}" = "1" ]; then
          echo "reroute=false" >> "$GITHUB_OUTPUT"
        else
          echo "reroute=true" >> "$GITHUB_OUTPUT"
        fi

    # Reroute lanes only: one runtime cache for the whole job, outside $HOME,
    # so test steps that re-home themselves (HOME="$(mktemp -d)") keep the
    # `jac install --global` deps the lane installed into it. Named .cache
    # because tests assert the global cache sits in a platform-style cache
    # directory. Sealed lanes keep the default $HOME layout: the native suite's
    # memory envelope was measured under it.
    - name: Pin the runtime cache for the reroute
      if: steps.mode.outputs.reroute == 'true'
      shell: bash
      run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/.cache" >> "$GITHUB_ENV"

    # THE one-precompile policy, consumer half. A reroute lane runs the
    # checkout's compiler source, which used to mean recompiling all ~1300
    # bundled modules per job. It does not any more: build-kit publishes the
    # tree its own payload build produced, and the compiler's precompiled-bundle
    # lookup (JacCompiler._get_precompiled_jir_bytecode) finds it by walking up
    # from each source file to this sibling `_precompiled` directory.
    #
    # The bundle is not trusted on sight. Every unit is checked against
    # precompiled_jir_matches_source -- module key plus ct-deps freshness -- so a
    # tree from another compiler generation can only miss, never mis-serve.
    - name: Fetch the shared precompile bundle
      if: steps.mode.outputs.reroute == 'true'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.precompiled-name }}
        path: jac/jaclang/_precompiled

    - name: Seed the reroute from the shared bundle
      if: steps.mode.outputs.reroute == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BUNDLE="$GITHUB_WORKSPACE/jac/jaclang/_precompiled"
        # MANIFEST.json marks a SEALED image, and a sealed bundle is trusted by
        # manifest instead of by per-module key. That trust is unreachable here
        # (sealed.image_for_bundle_dir only answers for an image the runtime
        # actually loaded, and this one is never registered), but dropping the
        # file removes the question entirely and leaves the key check as the one
        # reachable path.
        rm -f "$BUNDLE/MANIFEST.json"
        DIR="$(find "$BUNDLE" -maxdepth 1 -type d -name 'cpython-*' | head -1)"
        if [ -z "$DIR" ]; then
          echo "::error::precompile bundle has no cpython-<ver> tree; build-kit published a malformed artifact"
          exit 1
        fi
        UNITS="$(find "$DIR" -name '*.jir' | wc -l | tr -d ' ')"
        # The tree carries ~750+ units. A floor well under that catches an empty
        # or truncated artifact without tracking the exact module count.
        if [ "$UNITS" -lt 400 ]; then
          echo "::error::precompile bundle has only $UNITS units; expected the full jaclang tree"
          exit 1
        fi
        echo "seeded $UNITS precompiled units from ${DIR#"$GITHUB_WORKSPACE/"}"
        # Strict: from here a bundled unit this compiler declines to reuse is a
        # hard failure, not a silent 20-minute recompile. See jir.precompile_required.
        echo "JAC_PRECOMPILE_REQUIRED=1" >> "$GITHUB_ENV"

    # First use unpacks the payload (sealed lanes) or binds the seeded bundle
    # (reroute lanes). Both are seconds now; this step exists to pay it once,
    # serially, and to fail the lane here rather than inside the first worker of
    # a parallel pool. `jac --version` is not enough: it touches a tenth of the
    # modules a real compile does, so it would not exercise the bundle.
    #
    # On a reroute lane this is also the dev loop's first run: the checkout
    # has no kernel (libjac_* is gitignored) and nothing ever builds one
    # implicitly, so the run must load the kit's kernel where the kit keeps
    # it (the kit was built from these sources), print no bytecode notice,
    # and leave nothing beside the loader. A pull request's kit carries no
    # kernel (ci.yml build-kit): there the lane runs from bytecode by design,
    # still quietly. See cli/docs/internals/native-units.md.
    - name: Warm the runtime cache
      shell: bash
      env:
        REROUTE: ${{ steps.mode.outputs.reroute }}
      run: |
        set -euo pipefail
        WORK="$(mktemp -d)"
        printf 'with entry { print(6*7); }\n' > "$WORK/warm.jac"
        out="$(jac run "$WORK/warm.jac" 2>&1)" || { echo "$out"; exit 1; }
        tail -3 <<<"$out"
        grep -q 42 <<<"$out"
        if [ "$REROUTE" != "true" ]; then
          exit 0
        fi
        if grep -q "running from bytecode" <<<"$out"; then
          echo "::error::the first run fell back to bytecode instead of loading the kit's kernel"
          exit 1
        fi
        resolved="$(jac -c 'from jaclang.compiler.backends.native.kernel_resolve import resolve_kernel; k = resolve_kernel(); print("KERNEL", k.source if k else "none", k.lib_path if k else "")' 2>&1 | grep '^KERNEL ' | tail -1)"
        KIT_SITE="$(jac -c 'import os, sys; print(os.path.join(os.path.dirname(sys.prefix), "site", "jaclang"))' | tail -1)"
        python3 - "$GITHUB_WORKSPACE/jac/jaclang/compiler" "$KIT_SITE" "$resolved" <<'PY'
        import glob, json, os, sys
        def fail(message):
            print(f"::error::{message}")
            sys.exit(1)
        tree, kit, resolved = sys.argv[1:]
        found = glob.glob(os.path.join(tree, "libjac_compiler.*"))
        if found:
            fail(f"resolving a kernel wrote {found} beside the loader")
        manifest = os.path.join(kit, "_precompiled", "MANIFEST.json")
        native = json.load(open(manifest)).get("native") or {}
        _, source, *path = resolved.split(" ", 2) + [""]
        if native.get("kernel") == "none" and not native.get("artifact"):
            if source != "none":
                fail(f"the kit carries no kernel, but the lane resolved {resolved!r}")
            print("kit carries no kernel: the lane runs the bytecode compiler")
            sys.exit(0)
        if source != "kit":
            fail(f"the lane resolved {resolved!r}, not the kit's kernel built from these sources")
        lib = path[0] if path else ""
        if os.path.realpath(os.path.dirname(os.path.dirname(lib))) != os.path.realpath(kit):
            fail(f"the kit's kernel resolved at {lib}, outside the kit at {kit}")
        print(f"the lane runs the kit's kernel in place: {lib}")
        PY
