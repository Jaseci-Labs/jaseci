name: js_engine

# The js_engine accelerator's own lane. Releases and the CI kit ship bun, its
# floor; the engine is built only here in CI (`jac native build js-engine`
# locally). `build` builds the engine from this checkout and hands it off; two
# jobs then install it the way that command does for every jac and hold the
# official (sealed) binary to using it, side by side on their own runners:
#
#   test       the node suite and a client build run on it, and test262 must
#              pass everything its baseline does.
#   site-perf  the jaclang.org site build is timed on the engine and on node,
#              and the engine's ratio to node is held to
#              .github/js-engine-site-perf.json. A runner of its own keeps
#              test262 out of the timings.
#
# record-site-perf then lands a first or improved ratio as the new baseline.
#
# Called by ci.yml (a pull request that changes the engine or the compiler,
# one carrying the `native:js-engine` label, or a manual run) and nightly.yml.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: js-engine build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac
        with:
          # `zig build js-engine` runs the checkout's compiler on the
          # source-built interpreter, which loads the shim.
          need-build-inputs: "true"

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # The engine is a function of its sources and of the compiler that
      # lowers them; a hit restores a build `jac native build` then finds
      # current and only installs.
      - name: Restore the built engine
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: jac/zig-out/js
          key: js-engine-${{ runner.os }}-${{ runner.arch }}-c${{ steps.inputs.outputs.compiler }}-${{ hashFiles('jac/js_engine/**', 'jac/build.zig', 'jac/build.zig.zon') }}

      # The build runs through this checkout's compiler (the root jac.toml's
      # reroute), on the bundle the binary was built from (setup-jac keeps it
      # under its interpreter's name).
      - name: Seed the reroute from the binary's precompile bundle
        run: |
          set -euo pipefail
          BUNDLE="$(ls -d jac/.precompiled-build/*/ | head -1)"
          [ -n "$BUNDLE" ] || { echo "::error::setup-jac left no precompile bundle"; exit 1; }
          rm -rf jac/jaclang/_precompiled
          cp -r "$BUNDLE" jac/jaclang/_precompiled
          rm -f jac/jaclang/_precompiled/MANIFEST.json

      - name: Build the engine
        run: jac native build js-engine

      - name: Save the built engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: jac/zig-out/js
          key: js-engine-${{ runner.os }}-${{ runner.arch }}-c${{ steps.inputs.outputs.compiler }}-${{ hashFiles('jac/js_engine/**', 'jac/build.zig', 'jac/build.zig.zon') }}

      # A tarball keeps the executables' modes, which an artifact's zip drops.
      - name: Pack the engine for the test and perf jobs
        run: tar -cf "$RUNNER_TEMP/js-engine.tar" -C jac/zig-out js

      - name: Hand the engine to the test and perf jobs
        uses: actions/upload-artifact@v4
        with:
          name: js-engine-build
          path: ${{ runner.temp }}/js-engine.tar
          retention-days: 1
          if-no-files-found: error

  test:
    name: js-engine tests
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Set up the jac binary (cached)
        uses: ./.github/actions/setup-jac

      - name: Install the engine and seal the checkout
        uses: ./.github/actions/js-engine-install

      - name: Run the node suite and a client build on the engine
        env:
          JAC_TEST_JOBS: "0"
          JAC_TEST_STRICT: "1"
        run: >-
          jac test jac/tests/client/test_js_engine_node.jac
          jac/tests/runtimelib/test_client_bundle.jac

      - name: Restore the test262 checkout
        uses: actions/cache@v4
        with:
          path: jac/js_engine/engine/tests/test262/vendor
          key: test262-${{ hashFiles('jac/js_engine/engine/tests/test262/test262.sha') }}

      - name: Fetch test262 at the pinned commit
        run: jac/js_engine/tools/fetch_test_deps.sh test262

      # Fails on any test that does not pass and is not in known_failures.txt.
      # A per-test timeout above the runner's default keeps a slower runner
      # from turning passes into hangs.
      - name: Run test262
        working-directory: jac/js_engine
        run: |
          set -euo pipefail
          for suite in language built-ins; do
            jac engine/tests/test262/run_test262.jac --gc --timeout 30 \
              --filter "$suite" \
              --check-baseline engine/tests/test262/known_failures.txt
          done

      - name: Upload the test262 run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-run-log
          path: jac/js_engine/engine/tests/test262/.run_logs
          retention-days: 7
          if-no-files-found: ignore

  # The engine's speed on the jaclang.org site build, as a ratio to node's with
  # its optimizing tiers off (scripts/js_engine_site_perf.jac). The site is
  # scaffolded the way the README quickstart does it and its client bundle
  # built once, which writes the vite config the timed runs reuse. A ratio past
  # the band in .github/js-engine-site-perf.json fails the job; one below it
  # goes to record-site-perf. Node is pinned: a different node moves the ratio,
  # so the gate re-records instead of comparing.
  site-perf:
    name: js-engine site perf
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    outputs:
      record: ${{ steps.gate.outputs.record }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up the jac binary (cached)
        uses: ./.github/actions/setup-jac

      - name: Install the engine and seal the checkout
        uses: ./.github/actions/js-engine-install

      - name: Set up Node.js for the comparison
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'

      - name: Check the perf script
        run: jac test scripts/js_engine_site_perf.jac

      - name: Scaffold the site and build its client bundle
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          jac create site --awesome
          test -d site/.jac/client/node_modules/vite \
            || { echo "::error::jac create did not pull the site's npm deps"; exit 1; }
          cd site
          jac build --as client web
          test -f .jac/client/configs/vite.config.js \
            || { echo "::error::the client build wrote no vite config"; exit 1; }

      - name: Time the site build on node and on the engine
        run: >-
          jac run scripts/js_engine_site_perf.jac -- measure
          --client "$RUNNER_TEMP/site/.jac/client"

      - name: Hold the engine / node ratio to its baseline
        id: gate
        run: jac run scripts/js_engine_site_perf.jac -- gate

      - name: Upload the site perf results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: js-engine-site-perf
          path: ${{ runner.temp }}/js-engine-site-perf
          retention-days: 30
          if-no-files-found: ignore

  # Lands a first or improved ratio as the new baseline. On a pull request it
  # commits onto the pull request's own branch, so the baseline merges with the
  # change that earned it. Anywhere else (nightly or a manual run on main) it
  # opens, or refreshes, one pull request from ci/js-engine-site-perf, since
  # the protected branch takes no direct push. This is the one job with a write
  # token, and it runs no code from the change, only the GitHub API. A fork's
  # branch cannot take the commit; that case, and any refused write, leaves the
  # new baseline in the js-engine-site-perf artifact. A commit or pull request
  # made with this token starts no workflow run of its own.
  record-site-perf:
    needs: site-perf
    if: ${{ needs.site-perf.outputs.record == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: js-engine-site-perf
          path: site-perf

      - name: Commit the new baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          POLICY: .github/js-engine-site-perf.json
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          UPDATE_BRANCH: ci/js-engine-site-perf
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RATIO=$(jq -r .ratio site-perf/baseline.json)
          MESSAGE="ci(js_engine): record site build ratio $RATIO (engine / node --no-opt)"

          # Write the new baseline into $1's copy of the policy, keeping any
          # band edited there; the blob sha makes the write fail rather than
          # clobber a concurrent change.
          commit_to() {
            gh api "repos/$REPO/contents/$POLICY?ref=$1" > current.json \
              && jq -r .content current.json | base64 -d > policy.json \
              && jq --slurpfile b site-perf/baseline.json '.baseline = $b[0]' policy.json > updated.json \
              && gh api -X PUT "repos/$REPO/contents/$POLICY" \
                -f branch="$1" \
                -f sha="$(jq -r .sha current.json)" \
                -f message="$MESSAGE" \
                -f content="$(base64 -w0 updated.json)" > /dev/null
          }

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$HEAD_REPO" != "$REPO" ]; then
              echo "::notice::CI cannot commit to a fork's branch; commit site-perf/baseline.json from the js-engine-site-perf artifact as .baseline in $POLICY"
              exit 0
            fi
            if commit_to "$HEAD_REF"; then
              echo "::notice::recorded engine / node ratio $RATIO on $HEAD_REF"
            else
              echo "::warning::could not commit the new baseline to $HEAD_REF; it is in the js-engine-site-perf artifact"
            fi
            exit 0
          fi

          # Off a pull request: one standing update branch, reset onto the
          # branch that ran, carrying only the new baseline.
          BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/$REF_NAME" --jq .object.sha)
          if gh api "repos/$REPO/git/ref/heads/$UPDATE_BRANCH" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$UPDATE_BRANCH" \
              -f sha="$BASE_SHA" -F force=true > /dev/null
          else
            gh api "repos/$REPO/git/refs" \
              -f ref="refs/heads/$UPDATE_BRANCH" -f sha="$BASE_SHA" > /dev/null
          fi
          commit_to "$UPDATE_BRANCH"
          {
            echo "The js_engine lane measured a first or improved site build ratio on \`$REF_NAME\`; this records it as the baseline the lane holds later runs to."
            echo
            cat site-perf/summary.md
            echo
            echo "Measured in $RUN_URL. Opened by the js_engine lane's record-site-perf job."
          } > body.md
          OPEN=$(gh pr list --repo "$REPO" --head "$UPDATE_BRANCH" --base "$REF_NAME" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --repo "$REPO" --title "$MESSAGE" --body-file body.md
            echo "::notice::refreshed #$OPEN with engine / node ratio $RATIO"
          elif gh pr create --repo "$REPO" --base "$REF_NAME" --head "$UPDATE_BRANCH" \
              --title "$MESSAGE" --body-file body.md; then
            echo "::notice::opened a pull request recording engine / node ratio $RATIO"
          else
            echo "::warning::could not open the baseline pull request (is \"Allow GitHub Actions to create and approve pull requests\" on?); the commit is on $UPDATE_BRANCH"
          fi
